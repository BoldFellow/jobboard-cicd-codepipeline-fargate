[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jobboard-common"
version = "1.0.0"
description = "Shared models and DynamoDB helpers for Job Board services"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
]

[tool.setuptools.packages.find]
where = ["."]
